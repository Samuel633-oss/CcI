<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:dc="http://purl.org/dc/elements/1.1/"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:svg="http://www.w3.org/2000/svg"
   width="500"
   height="500"
   viewBox="0 0 500 500"
   version="1.1"
   id="alara_logo">
  <metadata>
    <rdf:RDF>
      <cc:Work
         rdf:about="">
        <dc:title>Alara Logo</dc:title>
        <dc:description>Alara Blockchain Logo - A decentralized cryptocurrency with 21M fixed supply and 5% transaction fee</dc:description>
        <dc:creator>Alara Core Developers</dc:creator>
        <dc:date>2025</dc:date>
        <cc:license rdf:resource="http://creativecommons.org/licenses/MIT/"/>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <defs>
    <linearGradient id="alara_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6BFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8E54E9" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="alara_glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#4A6BFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8E54E9" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="alara_glow_filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background glow effect -->
  <circle cx="250" cy="250" r="200" fill="url(#alara_glow)" opacity="0.3"/>
  
  <!-- Main logo circle with gradient -->
  <circle cx="250" cy="250" r="150" fill="url(#alara_gradient)" filter="url(#alara_glow_filter)"/>
  
  <!-- Inner circle for depth -->
  <circle cx="250" cy="250" r="120" fill="url(#alara_gradient)" opacity="0.7"/>
  
  <!-- Stylized 'A' in the center -->
  <path d="M220,150 L250,80 L280,150 L320,150 L265,220 L235,220 Z" fill="white" stroke="white" stroke-width="2"/>
  <path d="M240,180 L260,180 L260,200 L240,200 Z" fill="white" stroke="white" stroke-width="2"/>
  
  <!-- Decorative orbit lines -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="5,5"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="10,10"/>
  
  <!-- Small decorative dots -->
  <circle cx="150" cy="150" r="3" fill="white" opacity="0.6"/>
  <circle cx="350" cy="150" r="3" fill="white" opacity="0.6"/>
  <circle cx="250" cy="50" r="3" fill="white" opacity="0.6"/>
  <circle cx="150" cy="350" r="3" fill="white" opacity="0.6"/>
  <circle cx="350" cy="350" r="3" fill="white" opacity="0.6"/>
  
  <!-- Logo text -->
  <text x="250" y="380" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="40" font-weight="bold">ALARA</text>
  <text x="250" y="420" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" opacity="0.8">Decentralized Blockchain</text>
  <text x="250" y="445" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" opacity="0.6">21M Fixed Supply | 5% Transaction Fee</text>
</svg>
